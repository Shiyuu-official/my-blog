name: Update Pixiv Weekly Top10

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update weekly ranking data
        env:
          PIXIV_COOKIE: ${{ secrets.PIXIV_COOKIE }}
        run: node scripts/update-pixiv-weekly-top10.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/pixiv-weekly-top10.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add src/data/pixiv-weekly-top10.json
          git commit -m "chore: update pixiv weekly top10"
          git push

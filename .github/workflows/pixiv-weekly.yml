name: Update Pixiv Weekly Top10

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pixivpy3

      - name: Update weekly ranking data
        env:
          PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
        run: python scripts/update_pixiv_weekly_top10.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain src/data/pixiv-weekly-top10.json public/pixiv-weekly)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git add src/data/pixiv-weekly-top10.json public/pixiv-weekly
          git commit -m "chore: update pixiv weekly top10"
          git push
